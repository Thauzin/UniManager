<script>
    const SELECTOR_SIDEBAR_WRAPPER = '.sidebar-wrapper';
    const Default = {
        scrollbarTheme: 'os-theme-light',
        scrollbarAutoHide: 'leave',
        scrollbarClickScroll: true,
    };
    document.addEventListener('DOMContentLoaded', function () {
        const sidebarWrapper = document.querySelector(SELECTOR_SIDEBAR_WRAPPER);

        // Disable OverlayScrollbars on mobile devices to prevent touch interference
        const isMobile = window.innerWidth <= 992;

        if (
            sidebarWrapper &&
            OverlayScrollbarsGlobal?.OverlayScrollbars !== undefined &&
            !isMobile
        ) {
            OverlayScrollbarsGlobal.OverlayScrollbars(sidebarWrapper, {
                scrollbars: {
                    theme: Default.scrollbarTheme,
                    autoHide: Default.scrollbarAutoHide,
                    clickScroll: Default.scrollbarClickScroll,
                },
            });
        }
    });
</script>

<!--begin::Page Logic-->
<script>
    // Example starter JavaScript for disabling form submissions if there are invalid fields
    (() => {
        'use strict';
        const forms = document.querySelectorAll('.needs-validation');
        Array.from(forms).forEach((form) => {
            form.addEventListener('submit', (event) => {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        });
    })();

    /* ── DATA ── */
    const materias = [
        {
            nome: 'Programação Web', prof: 'Prof. Maria Santos',
            b1: 9.0, b2: 8.5, presenca: 95,
            atividades: [
                { nome: 'Trabalho HTML/CSS',  status: 'done'    },
                { nome: 'Projeto JavaScript', status: 'done'    },
                { nome: 'API REST',           status: 'done'    },
                { nome: 'Framework React',    status: 'pending' },
                { nome: 'Projeto Final',      status: 'pending' },
                { nome: 'Trabalho Extra',     status: 'pending' },
                { nome: 'Seminário',          status: 'done'    },
                { nome: 'Quiz Online',        status: 'done'    },
                { nome: 'Exercício 9',        status: 'done'    },
                { nome: 'Exercício 10',       status: 'done'    },
            ]
        },
        {
            nome: 'Banco de Dados', prof: 'Prof. João Oliveira',
            b1: 8.0, b2: 7.5, presenca: 88,
            atividades: [
                { nome: 'Modelagem ER',      status: 'done'    },
                { nome: 'SQL Básico',        status: 'done'    },
                { nome: 'Normalização',      status: 'done'    },
                { nome: 'Stored Procedures', status: 'late'    },
                { nome: 'Projeto BD',        status: 'pending' },
            ]
        },
        {
            nome: 'Estrutura de Dados', prof: 'Profa. Ana Lima',
            b1: 7.5, b2: 8.0, presenca: 92,
            atividades: [
                { nome: 'Listas Encadeadas', status: 'done'    },
                { nome: 'Árvores Binárias',  status: 'done'    },
                { nome: 'Grafos',            status: 'pending' },
                { nome: 'Ordenação',         status: 'done'    },
                { nome: 'Hash Tables',       status: 'late'    },
            ]
        },
        {
            nome: 'Engenharia de Software', prof: 'Prof. Carlos Mendes',
            b1: 9.5, b2: 9.0, presenca: 97,
            atividades: [
                { nome: 'Diagrama UML',   status: 'done'    },
                { nome: 'Caso de Uso',    status: 'done'    },
                { nome: 'Plano de Teste', status: 'done'    },
                { nome: 'Documentação',   status: 'done'    },
                { nome: 'Projeto Final',  status: 'pending' },
            ]
        },
        {
            nome: 'Redes de Computadores', prof: 'Prof. Roberto Faria',
            b1: 7.0, b2: 7.5, presenca: 80,
            atividades: [
                { nome: 'Modelo OSI',    status: 'done'    },
                { nome: 'TCP/IP',        status: 'done'    },
                { nome: 'Roteamento',    status: 'late'    },
                { nome: 'Firewall',      status: 'pending' },
                { nome: 'Projeto Redes', status: 'pending' },
            ]
        },
        {
            nome: 'Inteligência Artificial', prof: 'Profa. Fernanda Costa',
            b1: 8.5, b2: 9.0, presenca: 94,
            atividades: [
                { nome: 'Busca Heurística', status: 'done'    },
                { nome: 'Redes Neurais',    status: 'done'    },
                { nome: 'Machine Learning', status: 'done'    },
                { nome: 'NLP Básico',       status: 'pending' },
                { nome: 'Projeto IA',       status: 'pending' },
            ]
        },
    ];

    /* ── HELPERS ── */
    const avg         = m => (m.b1 + m.b2) / 2;
    const avgClass    = a => a >= 7 ? 'avg-good' : a >= 5 ? 'avg-ok' : 'avg-bad';
    const presClass   = p => p >= 90 ? 'presence-good' : p >= 75 ? 'presence-ok' : 'presence-bad';
    const presColor   = p => p >= 90 ? '#16a34a' : p >= 75 ? '#d97706' : '#dc2626';
    const avgColor    = a => a >= 7  ? '#16a34a' : a >= 5  ? '#d97706' : '#dc2626';
    const statusLabel = s => s === 'done' ? 'Entregue' : s === 'pending' ? 'Pendente' : 'Atrasado';
    const statusBadge = s => s === 'done' ? 'badge-done' : s === 'pending' ? 'badge-pending' : 'badge-late';

    /* ── SUMMARY ── */
    document.getElementById('media-geral').textContent =
        (materias.reduce((s, m) => s + avg(m), 0) / materias.length).toFixed(2);
    document.getElementById('freq-media').textContent =
        Math.round(materias.reduce((s, m) => s + m.presenca, 0) / materias.length) + '%';

    /* ── RENDER CARDS ── */
    const container = document.getElementById('cards-container');

    materias.forEach((m, i) => {
        const a     = avg(m);
        const done  = m.atividades.filter(x => x.status === 'done').length;
        const total = m.atividades.length;

        const col = document.createElement('div');
        col.className = 'col-12 mb-3';
        col.innerHTML = `
            <div class="card card-outline card-primary subject-card mb-0">
                <div class="card-header d-flex justify-content-between align-items-start">
                    <div>
                        <div class="card-title fw-bold mb-1">${m.nome}</div>
                        <small class="text-muted">
                            <i class="bi bi-person me-1"></i>${m.prof}
                        </small>
                    </div>
                    <span class="${presClass(m.presenca)}">${m.presenca}% de presença</span>
                </div>
                <div class="card-body">
                    <div class="row g-3 mb-3">
                        <div class="col-6 col-md-3">
                            <div class="text-muted" style="font-size:.75rem">1º Bimestre</div>
                            <div class="fw-bold fs-5">${m.b1.toFixed(1)}</div>
                        </div>
                        <div class="col-6 col-md-3">
                            <div class="text-muted" style="font-size:.75rem">2º Bimestre</div>
                            <div class="fw-bold fs-5">${m.b2.toFixed(1)}</div>
                        </div>
                        <div class="col-6 col-md-3">
                            <div class="text-muted" style="font-size:.75rem">Média</div>
                            <div class="fs-5 ${avgClass(a)}">${a.toFixed(2)}</div>
                        </div>
                        <div class="col-6 col-md-3">
                            <div class="text-muted" style="font-size:.75rem">Atividades</div>
                            <div class="fw-bold fs-5">${done}/${total}</div>
                        </div>
                    </div>
                    <button class="btn btn-outline-primary btn-sm btn-details" data-idx="${i}">
                        <i class="bi bi-eye me-1"></i>Ver Detalhes
                    </button>
                </div>
            </div>
        `;
        container.appendChild(col);
    });

    /* ── MODAL ── */
    const bsModal = new bootstrap.Modal(document.getElementById('modalDetalhes'));

    container.addEventListener('click', e => {
        const btn = e.target.closest('.btn-details');
        if (!btn) return;

        const m     = materias[+btn.dataset.idx];
        const a     = avg(m);
        const done  = m.atividades.filter(x => x.status === 'done').length;
        const total = m.atividades.length;
        const pct   = Math.round(done / total * 100);

        document.getElementById('modalDetalhesLabel').textContent = m.nome;
        document.getElementById('modal-prof').textContent = m.prof;

        const actRows = m.atividades.map(at => `
            <div class="d-flex justify-content-between align-items-center
                        px-3 py-2 rounded-2 mb-2"
                 style="background:#f8fafc;font-size:.875rem">
                <span>${at.nome}</span>
                <span class="badge ${statusBadge(at.status)} px-3 py-1"
                      style="font-size:.75rem">${statusLabel(at.status)}</span>
            </div>
        `).join('');

        document.getElementById('modal-body').innerHTML = `
            <div class="row g-3 mb-4">
                <div class="col-6 col-md-3">
                    <div class="rounded-3 p-3 text-center" style="background:#f8fafc">
                        <div class="text-muted mb-1" style="font-size:.7rem;text-transform:uppercase;letter-spacing:.5px">1º Bimestre</div>
                        <div class="fw-bold fs-4">${m.b1.toFixed(1)}</div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="rounded-3 p-3 text-center" style="background:#f8fafc">
                        <div class="text-muted mb-1" style="font-size:.7rem;text-transform:uppercase;letter-spacing:.5px">2º Bimestre</div>
                        <div class="fw-bold fs-4">${m.b2.toFixed(1)}</div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="rounded-3 p-3 text-center" style="background:#f8fafc">
                        <div class="text-muted mb-1" style="font-size:.7rem;text-transform:uppercase;letter-spacing:.5px">Média Final</div>
                        <div class="fw-bold fs-4" style="color:${avgColor(a)}">${a.toFixed(2)}</div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="rounded-3 p-3 text-center" style="background:#f8fafc">
                        <div class="text-muted mb-1" style="font-size:.7rem;text-transform:uppercase;letter-spacing:.5px">Atividades</div>
                        <div class="fw-bold fs-4">${done}/${total}</div>
                    </div>
                </div>
            </div>
            <div class="mb-3">
                <div class="d-flex justify-content-between mb-1" style="font-size:.875rem;font-weight:600">
                    <span>Frequência</span>
                    <span style="color:${presColor(m.presenca)}">${m.presenca}%</span>
                </div>
                <div class="prog-bar-wrap">
                    <div class="prog-bar-fill" style="width:${m.presenca}%;background:${presColor(m.presenca)}"></div>
                </div>
            </div>
            <div class="mb-4">
                <div class="d-flex justify-content-between mb-1" style="font-size:.875rem;font-weight:600">
                    <span>Atividades concluídas</span>
                    <span>${done}/${total} (${pct}%)</span>
                </div>
                <div class="prog-bar-wrap">
                    <div class="prog-bar-fill" style="width:${pct}%;background:#0d6efd"></div>
                </div>
            </div>
            <div class="fw-semibold mb-2" style="font-size:.875rem">Lista de Atividades</div>
            ${actRows}
        `;

        bsModal.show();
    });
</script>
<!--end::Page Logic-->
<!--end::Script-->

</body>
